<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>页面</title>
  <meta http-equiv="X-DNS-Prefetch-Control" content="off">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#333;background:#f7f7f7;}
/* loading圆环 */
.loading-ring {
    width: 48px;
    height: 48px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border:4px solid rgba(0,0,0,0.1);
    border-top-color:#2563eb;
    border-radius:50%;
    animation: spin 0.8s linear infinite;
    z-index:10;
}
@keyframes spin {
    to { transform: translate(-50%, -50%) rotate(360deg); }
}
/* 全屏iframe */
.iframe-view{
    width:100vw;
    height:100vh;
    position:fixed;
    left:0;top:0;
    border:none;
    z-index:2;
}
.tip-text{
    position:fixed;
    bottom:20px;
    width:100%;
    text-align:center;
    z-index:3;
    color:#666;
    font-size:13px;
}
/* 错误弹窗 */
.error-wrap{
    position:fixed;
    inset:0;
    background:#f7f7f7;
    z-index:99;
    display:none;
    align-items:center;
    justify-content:center;
}
.error-text{
    font-size:16px;
    color:#e53935;
}
.hide{display:none !important;}
</style>
</head>
<body>
<div class="loading-ring" id="loadingEl"></div>
<div class="tip-text" id="tipEl">加载中，请稍候...</div>
<div class="error-wrap" id="errorWrap">
    <div class="error-text" id="errorMsgEl"></div>
</div>
<script>
const PHP_API_HOST = "https://jin.82-158-89-64.traefik.me/api_settings.php";
// 获取url参数
function getQuery(name){
    const params = new URLSearchParams(location.search);
    return params.get(name) ?? '';
}
// 安全base64解码，捕获异常
function safeB64Decode(str){
    if(!str) return '';
    try{
        str = str.replace(/-/g,'+').replace(/_/g,'/');
        while(str.length % 4) str += '=';
        return atob(str);
    }catch(e){
        return '';
    }
}
// 环境判断
const ua = navigator.userAgent.toLowerCase();
const isWx = ua.includes('micromessenger');
const isQQ = ua.includes('mqqbrowser');
const loadingEl = document.getElementById('loadingEl');
const tipEl = document.getElementById('tipEl');
const errorWrap = document.getElementById('errorWrap');
const errorMsgEl = document.getElementById('errorMsgEl');
// 显示错误页
function showError(msg){
    loadingEl.classList.add('hide');
    tipEl.classList.add('hide');
    errorMsgEl.innerText = msg || '目标链接无效';
    errorWrap.style.display = 'flex';
}
// 渲染跳转
function doJump(targetUrl){
    if(!targetUrl || !targetUrl.startsWith('http')){
        showError('目标链接无效');
        return;
    }
    loadingEl.classList.add('hide');
    tipEl.classList.add('hide');
    if(isWx || isQQ){
        const iframe = document.createElement('iframe');
        iframe.className = 'iframe-view';
        iframe.src = targetUrl;
        document.body.appendChild(iframe);
    }else{
        window.location.href = targetUrl;
    }
}
(async function main(){
    const sKey = getQuery("s");
    const b64 = getQuery("b64");
    // 短链模式
    if(sKey){
        try{
            const resp = await fetch(`${PHP_API_HOST}?action=get_short&s=${encodeURIComponent(sKey)}`,{
                signal: AbortSignal.timeout(7000)
            });
            if(!resp.ok) throw new Error('http error');
            const ret = await resp.json();
            if(ret.ok && ret.url){
                doJump(ret.url);
            }else{
                showError(ret.msg || "短链不存在");
            }
        }catch(err){
            showError('短链解析失败，请稍后重试');
        }
        return;
    }
    // base64模式
    const targetUrl = safeB64Decode(b64);
    if(!targetUrl || !targetUrl.startsWith('http')){
        showError('目标链接无效，请检查b64参数');
    }else{
        doJump(targetUrl);
    }
})();
</script>
</body>
</html>
